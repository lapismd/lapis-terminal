[package]
name = "lapis-terminal-demo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []
[dependencies]
tauri = { version = "2.11.5" }
tauri-plugin-lapis-terminal = { path = "../../../crates/tauri-plugin-lapis-terminal" }
tempfile = "3"
serde_json = "1"
[build-dependencies]
tauri-build = "2"
