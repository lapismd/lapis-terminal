name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify, publish, or attest the qualified artifact for local bootstrap
        type: choice
        options: [verify, publish, attest]
        default: verify
        required: true
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: npm-production-release
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  plan:
    if: github.repository == 'lapismd/lapis-terminal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      ci_run: ${{ steps.plan.outputs.ci_run }}
      missing: ${{ steps.plan.outputs.missing }}
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - id: plan
        run: node scripts/npm-release.mjs plan
  publish:
    needs: plan
    if: inputs.mode == 'attest' || (inputs.mode == 'publish' && needs.plan.outputs.missing == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-production
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ needs.plan.outputs.sha }}
          path: .local/npm-release
          run-id: ${{ needs.plan.outputs.ci_run }}
          github-token: ${{ github.token }}
      - run: node scripts/npm-release.mjs verify-artifact
      - name: Probe existing protected bootstrap authentication
        if: inputs.mode == 'attest' && needs.plan.outputs.bootstrap == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN || secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm whoami --registry https://registry.npmjs.org
            echo "Protected bootstrap credential is available and authenticated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No protected bootstrap credential is available; use the signed artifact for local bootstrap." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Sign detached provenance without npm authentication
        if: inputs.mode == 'attest'
        run: node scripts/npm-release.mjs attest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode == 'attest'
        with:
          name: npm-bootstrap-${{ needs.plan.outputs.sha }}
          path: |
            .local/npm-release/manifest.json
            .local/npm-release/*.tgz
            .local/npm-release/provenance.sigstore.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish the initial package with an existing protected bootstrap credential
        if: inputs.mode == 'publish' && needs.plan.outputs.bootstrap == 'true'
        run: node scripts/npm-release.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN || secrets.NPM_TOKEN }}
      - name: Publish through the registered trusted publisher
        if: inputs.mode == 'publish' && needs.plan.outputs.bootstrap != 'true'
        run: node scripts/npm-release.mjs publish
  verify:
    needs: [plan, publish]
    if: always() && inputs.mode != 'attest' && needs.plan.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ needs.plan.outputs.sha }}
          path: .local/npm-release
          run-id: ${{ needs.plan.outputs.ci_run }}
          github-token: ${{ github.token }}
      - run: node scripts/npm-release.mjs verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-registry-receipt-${{ needs.plan.outputs.sha }}
          path: |
            .local/npm-release/registry-receipt.json
            .local/npm-release/consumer/package.json
            .local/npm-release/consumer/package-lock.json
          include-hidden-files: true
          if-no-files-found: error
  release:
    needs: [plan, verify]
    if: always() && inputs.mode == 'publish' && needs.plan.result == 'success' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ needs.plan.outputs.sha }}
          path: .local/npm-release
          run-id: ${{ needs.plan.outputs.ci_run }}
          github-token: ${{ github.token }}
      - run: node scripts/npm-github-release.mjs
