name: Changesets version PR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: changesets-version
  cancel-in-progress: false
jobs:
  version:
    if: github.repository == 'lapismd/lapis-terminal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - run: pnpm release:check
      - name: Qualify source-owned version inputs and actual release intent
        id: versioning
        uses: lapismd/lapis-ci/actions/guard-version-runtime@dc81ff65ba812bf005fb2a806eb3308bb8b5f71f
        with:
          qualification-file: .github/versioning-runtime.json
          detect-release-intent: "true"
      - run: pnpm dev:cargo -- fetch --locked
      - name: Mint repository-scoped version PR token
        id: app
        if: steps.versioning.outputs.hasChangesets == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        id: changesets
        if: steps.versioning.outputs.hasChangesets == 'true'
        with:
          version: pnpm release:version
          commit: Version coordinated terminal packages
          title: Version Packages
          commitMode: github-api
          createGithubReleases: false
          github-token: ${{ steps.app.outputs.token }}
      - name: Dispatch checks for the bot-created PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          branch=$(gh pr view "$VERSION_PR" --json headRefName --jq .headRefName)
          sha=$(gh pr view "$VERSION_PR" --json headRefOid --jq .headRefOid)
          test "$branch" = changeset-release/main
          gh workflow run ci.yml --ref "$branch" -f expected_sha="$sha"
          gh workflow run publish-spec-pages.yml --ref "$branch"
