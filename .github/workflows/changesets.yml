name: Changesets version PR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: changesets-version
  cancel-in-progress: false
jobs:
  version:
    if: github.repository == 'lapismd/lapis-terminal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - run: pnpm release:check
      - run: pnpm dev:cargo -- fetch --locked
      - uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        id: changesets
        with:
          version: pnpm release:version
          commit: Version coordinated terminal packages
          title: Version Packages
          commitMode: github-api
          createGithubReleases: false
          github-token: ${{ github.token }}
      - name: Dispatch checks for the bot-created PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          branch=$(gh pr view "$VERSION_PR" --json headRefName --jq .headRefName)
          sha=$(gh pr view "$VERSION_PR" --json headRefOid --jq .headRefOid)
          test "$branch" = changeset-release/main
          gh workflow run ci.yml --ref "$branch" -f expected_sha="$sha"
          gh workflow run publish-spec-pages.yml --ref "$branch"
