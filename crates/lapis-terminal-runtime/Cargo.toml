[package]
name = "lapis-terminal-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded native terminal sessions independent of application frameworks"
[dependencies]
lapis-terminal-engine = { path = "../lapis-terminal-engine", version = "0.1.0" }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile = "3"
serde_json = "1"
