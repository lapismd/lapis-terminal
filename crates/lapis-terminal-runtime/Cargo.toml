[package]
name = "lapis-terminal-runtime"
description = "Bounded native terminal sessions independent of application frameworks"

  [package.version]
  workspace = true

  [package.edition]
  workspace = true

  [package.license]
  workspace = true

  [package.rust-version]
  workspace = true

[dependencies]
portable-pty = "0.9"

  [dependencies.lapis-terminal-engine]
  path = "../lapis-terminal-engine"
  version = "0.1.2"

  [dependencies.uuid]
  version = "1"
  features = [ "v4", "serde" ]

  [dependencies.serde]
  version = "1"
  features = [ "derive" ]

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
